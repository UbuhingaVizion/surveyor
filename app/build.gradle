apply plugin: 'com.android.application'

// Load the release signing configuration from keystore.properties if present, otherwise from
// environment variables (CI secrets). keystore.properties is gitignored — never commit real
// signing credentials. If nothing is configured, release builds are left unsigned so the project
// still assembles for contributors without the key.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingStoreFile = keystoreProps['storeFile'] ?: System.getenv('KEYSTORE_FILE')
def signingStorePassword = keystoreProps['storePassword'] ?: System.getenv('KEYSTORE_STORE_PASSWORD')
def signingKeyAlias = keystoreProps['keyAlias'] ?: System.getenv('KEYSTORE_KEY_ALIAS')
def signingKeyPassword = keystoreProps['keyPassword'] ?: System.getenv('KEYSTORE_KEY_PASSWORD')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.ubuviz.surveyor"
        minSdkVersion 24
        targetSdk 36
        versionCode 1401
        versionName "14.0.1"

        testInstrumentationRunner "io.rapidpro.surveyor.test.TestRunner"
        testInstrumentationRunnerArguments notAnnotation: 'androidx.test.filters.FlakyTest'

        // Debug-only convenience: prefill the RapidPro host for test builds, e.g.
        //   ./gradlew installRapidproDebug -PdebugHost=https://xxxx.ngrok-free.app
        buildConfigField "String", "DEBUG_HOST", "\"${project.findProperty('debugHost') ?: ''}\""

        // Optionally restrict packaged native ABIs, e.g. CI emulator builds:
        //   ./gradlew connectedRapidproDebugAndroidTest -PabiFilters=x86_64
        // Keeps the test APK small enough to install reliably on slow emulators.
        if (project.hasProperty('abiFilters')) {
            ndk {
                abiFilters(*project.property('abiFilters').toString().split(','))
            }
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
        }
    }
    flavorDimensions 'version'
    productFlavors {
        rapidpro {
            dimension 'version'
        }
        "$thirdparty.applicationId" {
            dimension 'version'
            applicationId thirdparty.applicationId
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
    lint {
        abortOnError false
    }
    namespace 'io.rapidpro.surveyor'
    buildFeatures {
        buildConfig true
        resValues true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://jitpack.io" }
    google()
}

dependencies {
    implementation project(':goflow')

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // google services
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // background sync
    implementation 'androidx.work:work-runtime:2.9.1'

    // encrypted storage for API tokens
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // rest api
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // for location services
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // internationalization, language iso codes
    implementation 'com.neovisionaries:nv-i18n:1.11'

    // apache commons
    implementation 'org.apache.commons:commons-lang3:3.8.1'
    //noinspection GradleDependency newer versions throw java.nio.channels.CancelledKeyException in tests for some reason
    implementation 'commons-io:commons-io:2.4'

    implementation 'com.vdurmont:semver4j:2.2.0'

    // unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'

    // instrumented tests
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
    androidTestImplementation 'org.hamcrest:hamcrest-library:1.3'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
