name: CI
on: [push, pull_request]
jobs:
  unit:
    name: Build & unit tests
    env:
      jdk_version: '17'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.jdk_version }}
          distribution: temurin

      - name: Build the app
        run: ./gradlew assembleDebug

      - name: Check with Gradle
        run: ./gradlew check

      - name: Run unit tests
        run: ./gradlew test --stacktrace

  emulator:
    name: Instrumented tests (${{ matrix.api-level }} / ${{ matrix.target }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            target: google_apis
          - api-level: 30
            target: google_apis
          - api-level: 30
            target: default
          - api-level: 33
            target: google_apis
          - api-level: 35
            target: google_apis
    env:
      jdk_version: '17'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.jdk_version }}
          distribution: temurin

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew connectedRapidproDebugAndroidTest
