name: CI
on: [push, pull_request]
jobs:
  unit:
    name: Build & unit tests
    env:
      jdk_version: '17'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.jdk_version }}
          distribution: temurin

      - name: Build the app
        run: ./gradlew assembleDebug

      - name: Check with Gradle
        run: ./gradlew check

      - name: Run unit tests
        run: ./gradlew test --stacktrace

  emulator:
    name: Instrumented tests (${{ matrix.api-level }} / ${{ matrix.target }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            target: google_apis
          - api-level: 30
            target: default
          - api-level: 33
            target: google_apis
          - api-level: 35
            target: google_apis
    env:
      jdk_version: '17'
      # give the emulator time to shut down gracefully so `adb emu kill` doesn't fail
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: '60'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.jdk_version }}
          distribution: temurin

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_5
          force-avd-creation: true
          disable-snapshot: true
          emulator-boot-timeout: 600
          ram-size: 3072
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 5; done
            sh .github/scripts/run-instrumented-tests.sh

      - name: Upload instrumented test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-logs-${{ matrix.api-level }}-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            logcat.txt
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
